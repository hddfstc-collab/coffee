<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";

    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBCLFocz4cObeMB6pd8c3oWEdWPSnCrzHw",
      authDomain: "moody-e366d.firebaseapp.com",
      projectId: "moody-e366d",

    let autoReturnTimer = null;

    const graphColors = ['#00704A', '#ffc107', '#4285F4', '#ea4335', '#9c27b0', '#00bcd4'];

    const defaultState = {
        status: "open",
        ui: { enableTasteVote:true, enablePoll:true, enableInfoMode:true, autoReturnPoll:true },
        archive: [],
        current: { name: "원두를 등록해주세요", img: "", notes: "", recipe: "관리자 메뉴에서 설정해주세요.", taste: { good: 0, bad: 0 } },
        candidates: [],
        voters: { taste: [], poll: [] },
        forceNext: { enabled: false, beanIndex: 0 }
    };


    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const safeImg=value=>/^(data:image\/(png|jpeg|jpg|webp|gif);base64,|https?:\/\/)/i.test(value||'')?value:'';
    const noteHTML=value=>String(value||'').split(',').filter(n=>n.trim()).map(n=>`<span class="note-badge">${esc(n.trim())}</span>`).join('');
    const text=(id,value)=>{const el=$(id);if(el.textContent!==String(value))el.textContent=String(value);};
    const html=(id,value)=>{const el=$(id);if(el._html!==value){el.innerHTML=value;el._html=value;}};
    const signatures=new Map();
    function changed(key,value){const sig=JSON.stringify(value);if(signatures.get(key)===sig)return false;signatures.set(key,sig);return true;}
    let activeTab='home',frame=null,tasteBusy=false,pollBusy=false,connectionTimer=null,dailyRefreshTimer=null,isLoadingServer=false;
    function normalize(data={}){const d=structuredClone(defaultState),v={...d,...data};v.ui={...d.ui,...data.ui};v.current={...d.current,...data.current};v.current.taste={good:0,bad:0,...v.current.taste};v.candidates=Array.isArray(v.candidates)?v.candidates:[];v.voters={taste:[],poll:[],...v.voters};v.forceNext={...d.forceNext,...v.forceNext};return v;}
    const CACHE_KEY='coffeeApp.sharedData.v3';
    function loadCache(){try{const raw=localStorage.getItem(CACHE_KEY);return raw?normalize(JSON.parse(raw)):null;}catch(e){return null;}}
    function saveCache(value){try{localStorage.setItem(CACHE_KEY,JSON.stringify(value));}catch(e){console.warn('cache save failed',e);}}
    function applyUiImmediately(ui){if(!ui)return;const taste=$('taste-vote-card'),live=$('live-status-card'),info=$('nav-info'),poll=$('nav-poll');if(taste)taste.classList.toggle('hidden',!ui.enableTasteVote);if(live)live.classList.toggle('hidden',!ui.enablePoll);if(info)info.classList.toggle('hidden',!ui.enableInfoMode);if(poll)poll.classList.toggle('hidden',!ui.enablePoll);}
    const cachedState=loadCache();if(cachedState){state=cachedState;applyUiImmediately(state.ui);requestAnimationFrame(()=>window.render?.());}
    function connection(message,error=false){
        const row=document.querySelector('.connection-row'),el=$('connection');
        clearTimeout(connectionTimer);
        if(!error){if(row)row.classList.remove('show');el.classList.remove('error');return;}
        connectionTimer=setTimeout(()=>{text('connection',message);el.classList.add('error');if(row)row.classList.add('show');},2500);
    }
    function scheduleRender(){if(frame!==null)return;frame=requestAnimationFrame(()=>{frame=null;window.render();});}
    async function loadServerData(showMessage=false){
        if(isLoadingServer) return;
        isLoadingServer=true;
        try{
            const snap=await getDoc(docRef);
            if(snap.exists()){
                state=normalize(snap.data());
                saveCache(state);
                applyUiImmediately(state.ui);
                scheduleRender();
                connection('',false);
                if(showMessage) alert('서버의 최신 데이터를 불러왔습니다.');
            }else{
                if(!state){state=normalize();saveCache(state);applyUiImmediately(state.ui);scheduleRender();}
                if(showMessage) alert('서버에 저장된 데이터가 없습니다.');
            }
        }catch(e){
            console.error(e);
            connection(`불러오기 실패 (${e.code||e.message||'unknown'}) · 저장된 화면을 유지합니다.`,true);
            if(!state){state=loadCache()||normalize();applyUiImmediately(state.ui);scheduleRender();}
            if(showMessage) alert('서버 데이터 불러오기 실패: '+(e.message||e.code||'unknown'));
        }finally{
            isLoadingServer=false;
        }
    }

    function scheduleDailyRefresh(){
        clearTimeout(dailyRefreshTimer);
        const now=new Date();
        const next=new Date(now);
        next.setHours(8,0,0,0);
        if(now>=next) next.setDate(next.getDate()+1);
        dailyRefreshTimer=setTimeout(async()=>{
            await loadServerData(false);
            scheduleDailyRefresh();
        },Math.max(1000,next.getTime()-now.getTime()));
    }

    onAuthStateChanged(auth,user=>{
        if(user){
            currentUid=user.uid;
            loadServerData(false);
            scheduleDailyRefresh();
        }else{
            currentUid=null;
            signInAnonymously(auth).catch(e=>connection(`인증 실패 (${e.code}) · 저장된 화면을 유지합니다.`,true));
        }
    });

    window.reloadServerData=()=>loadServerData(true);
    window.retryConnection=()=>loadServerData(true);

    async function saveToServer(msg) {
        try { if(new TextEncoder().encode(JSON.stringify(state)).length>900000)throw Error('이미지 포함 데이터가 큽니다. 이미지 크기 또는 후보 수를 줄여주세요.'); saveCache(state); applyUiImmediately(state.ui); await setDoc(docRef, state); if (msg) alert(msg); } 
        catch (e) { alert("서버 저장 실패: "+e.message); connection("저장 실패 · 저장된 화면을 유지합니다.",true); }
    }

    window.navTo = function(id, title, el) {
        if(state&&((id==='poll'&&!state.ui.enablePoll)||(id==='info'&&!state.ui.enableInfoMode)))return;
        activeTab=id;
        const targetSection = document.getElementById('section-' + id);
        if(!targetSection) return;
        document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
        targetSection.classList.remove('hidden');
        document.getElementById('page-title').innerText = title;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(el) el.classList.add('active');
        document.getElementById('content-area').scrollTop = 0;
        if(state)window.render();

        clearTimeout(autoReturnTimer); 
        
        if (id === 'poll' && state && state.forceNext && state.forceNext.enabled && state.ui && state.ui.autoReturnPoll) {
            autoReturnTimer = setTimeout(() => {
                const homeTab = document.getElementById('nav-home');
                if(homeTab) window.navTo('home', '현재 원두 평가', homeTab);
            }, 10000); 
        }
    }

    window.adminLogin = function(el) { if(prompt("비밀번호") === "1234") window.navTo('admin', '관리자 설정', el); }
    window.zoomImg = function(src) { document.getElementById('modal-img').src = src; document.getElementById('img-modal').style.display = 'flex'; }
    
    window.previewImg = function(input) {
        const file = input.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                const MAX_SIZE = 1200; let width = img.width; let height = img.height;
                if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
                tempImgData = canvas.toDataURL('image/jpeg', 0.78);
            }
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

    async function submitVote(kind,value){
        if(!state||!currentUid||(kind==='taste'?tasteBusy:pollBusy))return;
        const expected=kind==='taste'?JSON.stringify([state.current.name,state.current.img]):JSON.stringify(state.candidates.map(c=>[c.name,c.img,c.active]));
        if(kind==='taste')tasteBusy=true;else pollBusy=true;window.render();
        try{await runTransaction(db,async tx=>{
            const snap=await tx.get(docRef);if(!snap.exists())throw Error('서버 데이터가 없습니다.');const latest=normalize(snap.data());
            if(latest.status==='closed'||!latest.ui[kind==='taste'?'enableTasteVote':'enablePoll'])throw Error('투표가 꺼져 있거나 마감되었습니다.');
            if(kind==='taste'){if(!['good','bad'].includes(value)||JSON.stringify([latest.current.name,latest.current.img])!==expected)throw Error('원두가 변경되었습니다. 다시 확인해주세요.');tx.update(docRef,{['current.taste.'+value]:(Number(latest.current.taste[value])||0)+1});}
            else{if(latest.forceNext.enabled||JSON.stringify(latest.candidates.map(c=>[c.name,c.img,c.active]))!==expected||!latest.candidates[value]||latest.candidates[value].active===false)throw Error('후보가 변경되었습니다. 다시 확인해주세요.');latest.candidates[value].votes=(Number(latest.candidates[value].votes)||0)+1;tx.update(docRef,{candidates:latest.candidates});}
        });}catch(e){alert('투표 저장 실패: '+e.message);}finally{if(kind==='taste')tasteBusy=false;else pollBusy=false;window.render();}
    }
    window.castTaste=type=>submitVote('taste',type);window.castVote=i=>submitVote('poll',i);
    window.render=function(){
        if(!state)return;const ui=state.ui,isClosed=state.status==='closed';
        $('taste-vote-card').classList.toggle('hidden',!ui.enableTasteVote);$('live-status-card').classList.toggle('hidden',!ui.enablePoll);
        $('nav-info').classList.toggle('hidden',!ui.enableInfoMode);$('nav-poll').classList.toggle('hidden',!ui.enablePoll);
        const solo=!ui.enableTasteVote&&!ui.enablePoll;document.querySelector('.home-wrapper').classList.toggle('solo',solo);document.querySelector('.home-right-column').classList.toggle('hidden',solo);
        if((activeTab==='poll'&&!ui.enablePoll)||(activeTab==='info'&&!ui.enableInfoMode)){window.navTo('home','현재 원두',$('nav-home'));return;}
        if(activeTab==='home'){
            const c=state.current;
            if(changed('current',[c.name,c.img,c.notes,c.recipe])){text('view-bean-name',c.name);html('view-notes',noteHTML(c.notes));text('view-recipe',c.recipe||'');$('view-recipe').classList.toggle('hidden',!c.recipe);const src=safeImg(c.img),img=$('view-bean-img');if(src&&img.getAttribute('src')!==src)img.src=src;img.classList.toggle('hidden',!src);$('bean-hero').classList.toggle('no-image',!src);}
            text('good-count',`추천 ${c.taste.good}`);text('bad-count',`비추천 ${c.taste.bad}`);const total=Number(c.taste.good)+Number(c.taste.bad);$('taste-bar').style.width=(total?c.taste.good/total*100:50)+'%';$('btn-good').disabled=$('btn-bad').disabled=isClosed||tasteBusy||!currentUid;
            const next=state.candidates[state.forceNext.beanIndex];let status='아직 투표 내역이 없습니다.';
            if(state.forceNext.enabled)status=next?`다음 원두 확정: ${next.name}`:'확정된 원두 정보가 없습니다.';
            else{const list=state.candidates.filter(c=>c.active!==false),max=Math.max(0,...list.map(c=>Number(c.votes)||0));if(max)status=`${list.filter(c=>Number(c.votes)===max).map(c=>c.name).join(' / ')} · ${max}표 (현재 1위)`;}
            text('live-status-content',status);$('live-status-card').querySelector('h3').textContent=state.forceNext.enabled?'다음 원두 확정':'다음 원두 투표 현황';
        }
        if(activeTab==='info'&&changed('library',state.candidates.map(c=>[c.name,c.img,c.notes,c.recipe,c.active]))){
            const list=state.candidates.map((c,i)=>({c,i})).filter(({c})=>c.active!==false);$('bean-library').classList.toggle('single',list.length===1);
            html('bean-library',list.map(({c,i})=>`<article class="bean-library-card" tabindex="0" role="button" onclick="openCandModal(${i})" onkeydown="if(event.key==='Enter')openCandModal(${i})">${safeImg(c.img)?`<img loading="lazy" decoding="async" src="${esc(safeImg(c.img))}" class="bean-library-img" alt="${esc(c.name)}">`:''}<h4 class="bean-library-name">${esc(c.name)}</h4>${noteHTML(c.notes)}${c.recipe?`<div class="recipe-box">${esc(c.recipe)}</div>`:''}</article>`).join('')||'<div class="bean-library-empty">등록된 원두 정보가 없습니다.</div>');
        }
        if(activeTab==='poll'){
            const forced=state.forceNext.enabled,next=state.candidates[state.forceNext.beanIndex];
            if(changed('poll-structure',[state.candidates.map(c=>[c.name,c.img,c.active,c.notes,c.recipe]),state.forceNext])){
                html('poll-list',forced?(next?`<h2>다음 원두 확정: ${esc(next.name)}</h2>${safeImg(next.img)?`<img class="bean-img" src="${esc(safeImg(next.img))}" onclick="zoomImg(this.src)" alt="다음 원두">`:''}${noteHTML(next.notes)}<div class="recipe-box">${esc(next.recipe)}</div><button class="btn-main" onclick="navTo('home','현재 원두',document.getElementById('nav-home'))">현재 원두로 돌아가기</button>`:'확정된 원두 정보가 없습니다.'):state.candidates.map((c,i)=>c.active===false?'':`<div class="thumb-item">${safeImg(c.img)?`<img class="thumb-img" src="${esc(safeImg(c.img))}" alt="${esc(c.name)}" onclick="openCandModal(${i})">`:'<div>이미지 없음</div>'}<div class="thumb-info" onclick="openCandModal(${i})"><div class="thumb-name">${esc(c.name)}</div><div class="vote-info"><span id="votes-${i}"></span><span id="pct-${i}"></span></div><div class="vote-bar-container"><div id="bar-${i}" class="vote-bar-fill"></div></div></div><button class="btn-vote thumb-btn" onclick="castVote(${i})">투표</button></div>`).join('')||'<p>등록된 후보가 없습니다.</p>');
            }
            const total=state.candidates.filter(c=>c.active!==false).reduce((a,c)=>a+(Number(c.votes)||0),0);text('poll-summary',forced?'투표 대신 다음 원두를 안내합니다.':`총 ${total}표 · ${isClosed?'투표 마감':'투표 진행 중'}`);
            if(!forced)state.candidates.forEach((c,i)=>{if(!$('votes-'+i))return;const pct=total?Math.round((Number(c.votes)||0)/total*100):0;text('votes-'+i,`${c.votes||0}표`);text('pct-'+i,pct+'%');$('bar-'+i).style.width=pct+'%';});
            document.querySelectorAll('.thumb-btn').forEach(btn=>{btn.disabled=isClosed||pollBusy||!currentUid;const label=isClosed?'마감됨':pollBusy?'저장 중':'투표';if(btn.textContent!==label)btn.textContent=label;});
        }
        if(activeTab==='admin'&&changed('admin',[ui,state.forceNext,state.candidates.map(c=>[c.name,c.active]),state.status]))renderAdmin();
    };
    function renderAdmin(){const ui=state.ui,isClosed=state.status==='closed';
        const featureManage=document.getElementById('admin-feature-manage');
        if(featureManage) featureManage.innerHTML=`
            <h3 style="margin-top:0;">화면 기능 설정 ⚙️</h3>
            <button class="btn-outline" onclick="reloadServerData()" style="margin-bottom:14px;">↻ 서버 최신 데이터 새로 불러오기</button>
            <div style="font-size:12px;color:#777;margin:-4px 0 10px;line-height:1.5;">앱 실행 시 1회, 이후 매일 오전 8시에 1회만 자동으로 불러옵니다.</div>

        document.getElementById('admin-poll-manage').innerHTML = state.candidates.map((c, i) => {

                <div style="display:flex; gap: 5px;">

    window.resetApp = function() { if(confirm("전체 초기화하시겠습니까?")) { state = structuredClone(defaultState); saveToServer("초기화 완료"); } }

    window.toggleVoting = async function() {
        if(!state) return; if(!state.status) state.status = "open"; 
        state.status = state.status === "closed" ? "open" : "closed";
        await saveToServer(state.status === "closed" ? "투표가 마감되었습니다!" : "투표가 시작되었습니다!"); window.render();
    }

    window.archiveCurrentPoll = async function() {
        if(!state) return; if(!confirm("현재 결과를 보관함에 저장하고 새 시즌을 시작합니까?")) return;
        if(!state.archive) state.archive = []; const today = new Date().toLocaleDateString('ko-KR');
        const lightCandidates = state.candidates.map(c => ({ name: c.name, votes: c.votes }));
        state.archive.push({ date: today, beanName: state.current.name, taste: { ...state.current.taste }, candidates: lightCandidates });
        state.current.taste = { good: 0, bad: 0 }; state.candidates.forEach(c => c.votes = 0); state.status = "open"; 
        if(state.voters) { state.voters.taste = []; state.voters.poll = []; }
        await saveToServer("새 시즌이 시작되었습니다!");
    }

    window.downloadArchiveExcel = function() {
        if(!state || !state.archive || state.archive.length === 0) return alert("다운로드할 기록이 없습니다.");
        const data = [ ["회차", "기록날짜", "마셨던 원두", "추천(👍)", "비추천(👎)", "다음 투표 1위", "득표수"] ];
        state.archive.forEach((arc, idx) => {
            let topCandName = "없음"; let topCandVotes = 0;
            if(arc.candidates && arc.candidates.length > 0) {
                let topCand = [...arc.candidates].sort((a,b) => b.votes - a.votes)[0];
                if(topCand && topCand.votes > 0) { topCandName = topCand.name; topCandVotes = topCand.votes; }
            }
            data.push([ idx + 1, arc.date || "날짜없음", arc.beanName || "", arc.taste ? arc.taste.good : 0, arc.taste ? arc.taste.bad : 0, topCandName, topCandVotes ]);
        });
        if(window.XLSX) {
            const wb = XLSX.utils.book_new(); const ws = XLSX.utils.aoa_to_sheet(data);
            ws['!cols'] = [ {wch: 5}, {wch: 15}, {wch: 30}, {wch: 10}, {wch: 10}, {wch: 25}, {wch: 10} ];
            XLSX.utils.book_append_sheet(wb, ws, "시즌기록");
            try { XLSX.writeFile(wb, "커피매니저_시즌기록.xlsx"); } catch (e) { alert("엑셀 생성 오류"); }
        } else {
            const csv='\uFEFF'+data.map(row=>row.map(value=>'"'+String(value??'').replaceAll('"','""')+'"').join(',')).join('\r\n');
            const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
            const a=document.createElement('a'); a.href=url; a.download='커피매니저_시즌기록.csv'; a.click(); URL.revokeObjectURL(url);
            alert('XLSX 모듈이 차단되어 Excel에서 열 수 있는 CSV로 저장했습니다.');
        }
    }

    window.toggleCandidate = function(i) {

    window.setCandidateAsCurrent = function(i) {
        if(!state) return; if(!confirm(`'${state.candidates[i].name}'을 현재 원두로 올립니까?`)) return;
        state.current = { name: state.candidates[i].name, img: state.candidates[i].img || "", notes: state.candidates[i].notes || "", recipe: state.candidates[i].recipe || "", taste: { good: 0, bad: 0 } };
        state.candidates.forEach(c => c.votes = 0); if(!state.voters) state.voters = { taste: [], poll: [] };
        state.voters.taste = []; state.voters.poll = []; state.status = "open";

    window.toggleFeature = async function(type) {
        if(!state) return;
        if(!state.ui) state.ui={ enableTasteVote:true, enablePoll:true, enableInfoMode:true, autoReturnPoll:true };
        if(type==='taste') state.ui.enableTasteVote=!state.ui.enableTasteVote;
        if(type==='poll') state.ui.enablePoll=!state.ui.enablePoll;
        if(type==='info') state.ui.enableInfoMode=!state.ui.enableInfoMode;
        if(type==='return') state.ui.autoReturnPoll=!state.ui.autoReturnPoll;
        saveCache(state);
        applyUiImmediately(state.ui);
        window.render();
        await saveToServer();
    };
